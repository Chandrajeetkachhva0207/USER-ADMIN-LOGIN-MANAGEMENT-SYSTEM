<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | Premium UI</title>
  <meta name="description" content="A secure admin login portal.">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/auth.css">
  <style>
    /* Admin specific overrides */
    :root {
      --primary-color: #ef4444;
      --primary-hover: #dc2626;
    }
  </style>
</head>
<body>
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="auth-container">
    <div class="glass-card">
      <div class="auth-header">
        <h1>Admin Portal</h1>
        <p>Authorized personnel only</p>
      </div>

      <form id="adminForm">
        <div class="form-group">
          <label for="adminId">Admin ID or Email</label>
          <input type="text" id="adminId" placeholder="admin@system.com" required>
          <span class="error-msg"></span>
        </div>

        <div class="form-group">
          <label for="password">Admin Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
          <span class="error-msg"></span>
        </div>

        <div class="form-group">
          <label for="token">Security Token (2FA)</label>
          <input type="text" id="token" placeholder="6-digit code">
        </div>

        <button type="submit" class="btn-primary">Secure Login</button>
      </form>

      <div class="role-switch">
        <a href="index.html" class="role-badge">User Login</a>
        <a href="admin-login.html" class="role-badge active">Admin Access</a>
      </div>
    </div>
  </div>

  <script src="./js/main.js"></script>
</body>
</html>
