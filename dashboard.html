<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard | Professional UI</title>
  <meta name="description" content="User dashboard area.">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>
  <div id="toast-container"></div>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>ProSystem</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active">
          <i class="fa-solid fa-house"></i> Overview
        </a>
        <a href="#" class="nav-item">
          <i class="fa-solid fa-user"></i> My Profile
        </a>
        <a href="#" class="nav-item">
          <i class="fa-solid fa-gear"></i> Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn-primary" style="width: 100%; background: var(--input-bg); color: var(--text-main);" onclick="toggleTheme()">
          <i class="fa-solid fa-moon"></i> Theme
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Nav -->
      <header class="top-nav">
        <div class="nav-left">
          <button class="sidebar-toggle" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="search-bar">
            <i class="fa-solid fa-search"></i>
            <input type="text" placeholder="Search...">
          </div>
        </div>
        <div class="nav-right">
          <button class="icon-btn">
            <i class="fa-regular fa-bell"></i>
            <span class="badge">3</span>
          </button>
          <div class="user-profile" id="userProfileBtn">
            <div class="avatar" id="avatarInitial">U</div>
            <div class="user-info">
              <span class="user-name" id="displayUsername">User</span>
              <span class="user-role">Member</span>
            </div>
            <i class="fa-solid fa-chevron-down" style="font-size: 12px; margin-left: 8px;"></i>
          </div>
        </div>
      </header>

      <!-- Dashboard Body -->
      <div class="dashboard-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Welcome back!</h1>
            <p class="page-subtitle" id="displayEmail">user@example.com</p>
          </div>
          <button id="logoutBtn" class="btn-primary" style="background: var(--danger);">
            <i class="fa-solid fa-power-off"></i> Logout
          </button>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon blue"><i class="fa-solid fa-clock"></i></div>
            <div class="stat-details">
              <h3>24h</h3>
              <p>Active Session</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green"><i class="fa-solid fa-shield-check"></i></div>
            <div class="stat-details">
              <h3>Secure</h3>
              <p>Account Status</p>
            </div>
          </div>
        </div>
        
        <div class="chart-container">
          <h3 style="margin-bottom: 20px;">Activity Overview</h3>
          <canvas id="activityChart" height="100"></canvas>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
